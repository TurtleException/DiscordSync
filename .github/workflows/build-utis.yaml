name: Build Utils Module

on:
  push:
    branches:
      - "v03"
    paths:
      - "dsync-utils"
  pull_request:
    branches:
      - "v03"
    paths:
      - "dsync-utils"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Utils Module
        run: mvn -B package --file dsync-utils/pom.xml
